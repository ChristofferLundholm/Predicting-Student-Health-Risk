[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "student-health-risk"
version = "0.1.0"
description = "Train and serve a student health risk classifier."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.3",
    "lightgbm>=4.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
student-health-train = "student_health.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
